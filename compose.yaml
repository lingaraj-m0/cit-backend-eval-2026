services:
  processor:
    build: .
    env_file: .env
    environment:
      PROCESSOR_HOST: 0.0.0.0
      PROCESSOR_PORT: "8001"
      PROCESSOR_DB: /app/state/processor.sqlite3
    ports:
      - "127.0.0.1:8001:8001"
    volumes:
      - processor-state:/app/state
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 5
    mem_limit: 256m
volumes:
  processor-state:
